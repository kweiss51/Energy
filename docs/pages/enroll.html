<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | Energy Course Platform</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../scripts/analytics.js"></script>
        <script>
        // Analytics: Track page view and time on page
        let pageStartTime = Date.now();
        function sendAnalyticsEvent(type, data) {
            if (window.trackPageView && type === 'pageview') {
                window.trackPageView(data.page);
            } else if (window.trackButtonClick && type === 'button') {
                window.trackButtonClick(data.buttonId);
            } else if (window.trackCustomEvent) {
                window.trackCustomEvent(type, data);
            } else {
                console.log('Analytics event:', type, data);
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            sendAnalyticsEvent('pageview', { page: window.location.pathname });
        });
        window.addEventListener('beforeunload', function() {
            const duration = Math.round((Date.now() - pageStartTime) / 1000);
            sendAnalyticsEvent('time_on_page', { page: window.location.pathname, seconds: duration });
        });
        </script>
    <script src="../scripts/courses-data.js"></script>
</head>
<body>
    <header>
        <div id="header-placeholder"></div>
    </header>

    <main>
        <section class="enrollment-section">
            <h1>Tell Us About You</h1>
            <p class="lead">Before you begin, please share a few details to personalize your learning experience. Enrollment is free and your information will help us improve the course for you.</p>
            
            <div class="enrollment-container">
                <div class="selected-course-info" id="selected-course-info">
                    <!-- Course info will be populated by JavaScript -->
                </div>

                <form id="enrollment-form" class="enrollment-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label for="course">Select Course</label>
                        <select id="course" name="course" required>
                            <option value="">--Please choose a course--</option>
                            <option value="renewable-energy">Introduction to Renewable Energy</option>
                            <option value="solar-power">Solar Power Systems</option>
                            <option value="energy-efficiency">Energy Efficiency</option>
                            <option value="wind-energy">Wind Energy Technology</option>
                        </select>
                    </div>



                    <button type="submit" class="cta-button">Start Course</button>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Component Loading -->
    <script>
        async function loadComponent(path, elementId) {
            try {
                const response = await fetch(path);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading component ${path}:`, error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Load header and footer
            loadComponent('../components/Header.html', 'header-placeholder');
            loadComponent('../components/Footer.html', 'footer-placeholder');




            // Handle form submission
                        document.getElementById('enrollment-form').addEventListener('submit', function(e) {
                                e.preventDefault();
                                // Store user info in localStorage for later use
                                const userInfo = {
                                    name: document.getElementById('name').value,
                                    email: document.getElementById('email').value,
                                    phone: document.getElementById('phone').value,
                                    course: document.getElementById('course').value
                                };
                                localStorage.setItem('energyUserInfo', JSON.stringify(userInfo));
                                alert('Thank you! Your information has been saved. You will now begin your course.');
                                // Redirect to the selected course home or first lesson
                                if (userInfo.course === 'renewable-energy') {
                                    window.location.href = '../pages/renewable-essentials/week1-lesson1.html';
                                } else if (userInfo.course === 'solar-power') {
                                    window.location.href = '../pages/advanced-solar/week1-lesson1.html';
                                } else if (userInfo.course === 'energy-efficiency') {
                                    window.location.href = '../pages/energy-fundamentals/week1-lesson1.html';
                                } else if (userInfo.course === 'wind-energy') {
                                    window.location.href = '../pages/grid-mastery/week1-lesson1.html';
                                } else {
                                    window.location.href = '../index.html';
                                }
                        });
        });
    </script>

    <script src="../main.js"></script>
    <script src="../navigation.js"></script>
</body>
</html>
