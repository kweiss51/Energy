<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Learning Path | Alternata</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav class="nav-minimal nav-modern">
    <div class="nav-content">
      <a href="../index.html" class="nav-logo">Alternata</a>
      <div class="nav-links" id="navLinks">
        <a href="courses.html">Courses</a>
        <a href="about.html">About</a>
        <a href="assessment.html" class="nav-cta" aria-current="page">Find Your Path</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>
  <script>
    // Hamburger menu toggle for mobile
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (navToggle && navLinks) {
        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('open');
            navToggle.classList.toggle('open');
        });
    }
  </script>
  <main class="assessment-content">
    <h1>Find Your Perfect Learning Path</h1>
    <form id="assessment-form" class="assessment-form">
      <div class="assessment-step" id="step-0">
        <h2>Let's get started! Tell us about yourself.</h2>
        <label for="name">Full Name</label><br>
        <input type="text" id="name" name="name" required style="width:100%;padding:0.5rem;margin-bottom:1rem;"><br>
        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" required style="width:100%;padding:0.5rem;margin-bottom:1.5rem;"><br>
        <button type="button" class="next-btn">Next</button>
      </div>
      <div class="assessment-step" id="step-1">
  <h2>1. What best describes your current experience with energy systems?</h2>
        <label><input type="radio" name="experience" value="beginner" required> I'm new to energy concepts</label><br>
        <label><input type="radio" name="experience" value="intermediate"> I have some technical background</label><br>
        <label><input type="radio" name="experience" value="advanced"> I'm experienced in the field</label>
        <button type="button" class="next-btn">Next</button>
      </div>
      <div class="assessment-step" id="step-2" style="display:none;">
        <h2>2. What is your main goal?</h2>
        <label><input type="radio" name="goal" value="career"> Start or advance my career</label><br>
        <label><input type="radio" name="goal" value="project"> Complete a specific project</label><br>
        <label><input type="radio" name="goal" value="curiosity"> Satisfy my curiosity</label>
        <button type="button" class="prev-btn">Back</button>
        <button type="button" class="next-btn">Next</button>
      </div>
      <div class="assessment-step" id="step-3" style="display:none;">
        <h2>3. Which topic excites you most?</h2>
        <label><input type="radio" name="topic" value="fundamentals" required> Understanding the basics</label><br>
        <label><input type="radio" name="topic" value="renewables"> Renewable energy</label><br>
        <label><input type="radio" name="topic" value="solar"> Advanced solar design</label><br>
        <label><input type="radio" name="topic" value="grid"> Grid integration</label><br>
        <label><input type="radio" name="topic" value="storage"> Energy storage</label><br>
        <label><input type="radio" name="topic" value="microgrid"> Microgrid design</label>
        <button type="button" class="prev-btn">Back</button>
        <button type="submit" class="cta-button">See My Path</button>
      </div>
    </form>
    <div id="assessment-result" class="assessment-result" style="display:none;"></div>
  </main>
  <script>
    const steps = Array.from(document.querySelectorAll('.assessment-step'));
    let currentStep = 0;
    function showStep(idx) {
      steps.forEach((step, i) => step.style.display = i === idx ? '' : 'none');
      currentStep = idx;
    }
    document.querySelectorAll('.next-btn').forEach(btn => btn.onclick = () => showStep(currentStep + 1));
    document.querySelectorAll('.prev-btn').forEach(btn => btn.onclick = () => showStep(currentStep - 1));
    showStep(0); // Start at the new name/email step

    document.getElementById('assessment-form').onsubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const exp = document.querySelector('input[name="experience"]:checked')?.value;
      const goal = document.querySelector('input[name="goal"]:checked')?.value;
      const topic = document.querySelector('input[name="topic"]:checked')?.value;
      if (!name || !email) {
        alert('Please enter your name and email.');
        showStep(0);
        return;
      }
      let suggestion = '';
      let link = '';
      if (topic === 'fundamentals' || exp === 'beginner') {
        suggestion = 'Energy Systems Fundamentals';
        link = 'energy-fundamentals/week1-lesson1.html';
      } else if (topic === 'renewables') {
        suggestion = 'Renewable Energy Essentials';
        link = 'renewable-essentials/week1-lesson1.html';
      } else if (topic === 'solar') {
        suggestion = 'Advanced Solar Design';
        link = 'advanced-solar/week1-lesson1.html';
      } else if (topic === 'grid') {
        suggestion = 'Grid Integration Mastery';
        link = 'grid-mastery/week1-lesson1.html';
      } else if (topic === 'storage') {
        suggestion = 'Energy Storage Solutions';
        link = 'storage-solutions/week1-lesson1.html';
      } else if (topic === 'microgrid') {
        suggestion = 'Microgrid Design';
        link = 'microgrid-design/week1-lesson1.html';
      } else {
        suggestion = 'Energy Systems Fundamentals';
        link = 'energy-fundamentals/week1-lesson1.html';
      }
      document.getElementById('assessment-form').style.display = 'none';
      document.getElementById('assessment-result').style.display = '';
      document.getElementById('assessment-result').innerHTML = `<h2>Your Recommended Path:</h2><p><strong>${suggestion}</strong></p><a href="${link}" class="cta-button">Start This Course</a>`;
    };
  </script>
</body>
</html>
