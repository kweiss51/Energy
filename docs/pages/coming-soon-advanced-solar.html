<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Solar Technology — Coming Soon</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../scripts/courses-data.js"></script>
</head>
<body class="course-detail-page">
    <div class="course-image-hero"><img src="../images/advanced-solar1.jpeg" alt="Advanced Solar Technology" class="course-hero-image" style="width:100%;max-height:340px;object-fit:cover;display:block;"></div>
    <main class="course-detail-content" style="padding-top:0;">
        <div class="content-wrapper" style="max-width:540px;">
            <div class="content-main" style="text-align:center;">
                <h1 style="font-size:2.2rem;margin-top:2rem;">Ready to Master Solar Power?<br>The Solution is Coming Soon.</h1>
                <p style="font-size:1.25rem;margin:2rem 0 2.5rem 0;">Take your solar expertise to the next level.<br>Be the first to unlock advanced design and implementation strategies.</p>
                <form id="notify-form" style="margin-bottom:2.5rem;">
                    <input type="email" id="notify-email" name="email" placeholder="Your email address" required style="padding:0.75rem 1rem;border-radius:6px;border:1.5px solid #ccc;font-size:1rem;width:70%;max-width:320px;">
                    <button type="submit" class="cta-button" style="margin-left:0.5rem;padding:0.8rem 1.5rem;">Get Notified When It Launches</button>
                </form>
                <div id="notify-success" style="display:none;color:var(--color-primary);font-weight:500;margin-bottom:2rem;">Thank you! You'll be the first to know.</div>
                <div style="font-size:1.1rem;color:var(--color-text-light);margin-bottom:2.5rem;">Get a free sneak peek lesson when you sign up.</div>
            </div>
        </div>
    </main>
    <script>
    document.getElementById('notify-form').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('notify-form').style.display = 'none';
        document.getElementById('notify-success').style.display = 'block';
    });
    </script>
</body>
</html>
