<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses | Energy Course Platform</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header>
        <div id="header-placeholder"></div>
    </header>

    <main>
        <section class="courses-section">
            <h1>Available Courses</h1>
            <div class="course-list" id="course-cards-placeholder"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Component Loading -->
    <script>
        // Function to load HTML components
        async function loadComponent(path, elementId) {
            try {
                const response = await fetch(path);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading component ${path}:`, error);
            }
        }

        // Load all components when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('../components/Header.html', 'header-placeholder');
            loadComponent('../components/Footer.html', 'footer-placeholder');
            
            // Load course cards
            fetch('../components/CourseCard.html')
                .then(response => response.text())
                .then(template => {
                    const coursesContainer = document.getElementById('course-cards-placeholder');
                    const courses = [
                        {
                            title: "Introduction to Renewable Energy",
                            description: "Learn the fundamentals of renewable energy sources and their impact on our environment.",
                            image: "../assets/renewable-energy.jpg"
                        },
                        {
                            title: "Solar Power Systems",
                            description: "Master the principles of solar power generation and system design for residential and commercial applications.",
                            image: "../assets/solar-power.jpg"
                        },
                        {
                            title: "Energy Efficiency",
                            description: "Discover techniques and strategies for optimizing energy usage in various settings.",
                            image: "../assets/energy-efficiency.jpg"
                        },
                        {
                            title: "Wind Energy Technology",
                            description: "Explore the technology behind wind power generation and its role in the renewable energy landscape.",
                            image: "../assets/wind-energy.jpg"
                        }
                    ];
                    
                    courses.forEach(course => {
                        const courseElement = document.createElement('div');
                        courseElement.innerHTML = template
                            .replace(/\{\{title\}\}/g, course.title)
                            .replace(/\{\{description\}\}/g, course.description)
                            .replace(/\{\{image\}\}/g, course.image);
                        coursesContainer.appendChild(courseElement);
                    });
                })
                .catch(error => console.error('Error loading course cards:', error));
        });
    </script>

    <script src="../main.js"></script>
    <script src="../navigation.js"></script>
</body>
</html>
