<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | Energy Course Platform</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../scripts/courses-data.js"></script>
</head>
<body>
    <header>
        <div id="header-placeholder"></div>
    </header>

    <main>
        <section class="enrollment-section">
            <h1>Enroll in Your Course</h1>
            <p class="lead">Take the next step in your energy education journey.</p>
            
            <div class="enrollment-container">
                <div class="selected-course-info" id="selected-course-info">
                    <!-- Course info will be populated by JavaScript -->
                </div>

                <form id="enrollment-form" class="enrollment-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label for="course">Select Course</label>
                        <select id="course" name="course" required>
                            <option value="">--Please choose a course--</option>
                            <option value="renewable-energy">Introduction to Renewable Energy</option>
                            <option value="solar-power">Solar Power Systems</option>
                            <option value="energy-efficiency">Energy Efficiency</option>
                            <option value="wind-energy">Wind Energy Technology</option>
                        </select>
                    </div>

                    <div class="form-group payment-info">
                        <h3>Payment Information</h3>
                        <div class="price-display">
                            <span>Course Price:</span>
                            <span class="price" id="course-price">$99.99</span>
                        </div>
                        <!-- Payment form fields would go here in a real implementation -->
                    </div>

                    <button type="submit" class="cta-button">Complete Enrollment</button>
                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Component Loading -->
    <script>
        async function loadComponent(path, elementId) {
            try {
                const response = await fetch(path);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading component ${path}:`, error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Load header and footer
            loadComponent('../components/Header.html', 'header-placeholder');
            loadComponent('../components/Footer.html', 'footer-placeholder');


            // Get course from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course');
            let coursePrice = '$99.99';
            if (courseId && window.courseDetails && window.courseDetails[courseId]) {
                coursePrice = window.courseDetails[courseId].price;
                const courseSelect = document.getElementById('course');
                if (courseSelect) courseSelect.value = courseId;
            }
            document.getElementById('course-price').textContent = coursePrice;

            // Handle form submission
            document.getElementById('enrollment-form').addEventListener('submit', function(e) {
                e.preventDefault();
                // Here you would typically handle the form submission
                // For now, we'll just show an alert
                alert('Thank you for enrolling! You will receive a confirmation email shortly.');
                window.location.href = '../index.html';
            });
        });
    </script>

    <script src="../main.js"></script>
    <script src="../navigation.js"></script>
</body>
</html>
