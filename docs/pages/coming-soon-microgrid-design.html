<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body class="course-detail-page">
        <script>
        // Analytics: Track page view and time on page
        let pageStartTime = Date.now();
        function sendAnalyticsEvent(type, data) {
            if (window.trackPageView && type === 'pageview') {
                window.trackPageView(data.page);
            } else if (window.trackButtonClick && type === 'button') {
                window.trackButtonClick(data.buttonId);
            } else if (window.trackCustomEvent) {
                window.trackCustomEvent(type, data);
            } else {
                console.log('Analytics event:', type, data);
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            sendAnalyticsEvent('pageview', { page: window.location.pathname });
        });
        window.addEventListener('beforeunload', function() {
            const duration = Math.round((Date.now() - pageStartTime) / 1000);
            sendAnalyticsEvent('time_on_page', { page: window.location.pathname, seconds: duration });
        });
        </script>
    <div class="course-image-hero"><img src="../images/microgrid-design1.jpeg" alt="Microgrid Design & Implementation" class="course-hero-image" style="width:100%;max-height:340px;object-fit:cover;display:block;"></div>
    <main class="course-detail-content" style="padding-top:0;">
        <div class="content-wrapper" style="max-width:540px;">
            <div class="content-main" style="text-align:center;">
                <h1 style="font-size:2.2rem;margin-top:2rem;">Want to Design Resilient Microgrids?<br>The Solution is Coming Soon.</h1>
                <p style="font-size:1.25rem;margin:2rem 0 2.5rem 0;">Become a microgrid specialist.<br>Be the first to unlock the secrets of resilient, efficient microgrid systems.</p>
                <form id="notify-form" style="margin-bottom:2.5rem;">
                    <input type="email" id="notify-email" name="email" placeholder="Your email address" required style="padding:0.75rem 1rem;border-radius:6px;border:1.5px solid #ccc;font-size:1rem;width:70%;max-width:320px;">
                    <button type="submit" class="cta-button" style="margin-left:0.5rem;padding:0.8rem 1.5rem;">Get Notified When It Launches</button>
                </form>
                <div id="notify-success" style="display:none;color:var(--color-primary);font-weight:500;margin-bottom:2rem;">Thank you! You'll be the first to know.</div>
                <div style="font-size:1.1rem;color:var(--color-text-light);margin-bottom:2.5rem;">Get a free sneak peek lesson when you sign up.</div>
            </div>

    <script>
    document.getElementById('notify-form').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('notify-form').style.display = 'none';
