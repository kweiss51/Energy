<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll in Course</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
    <header>
        <!-- Include Header Component -->
        <div id="header-placeholder"></div>
    </header>

    <main>
        <h1>Enroll in Your Course</h1>
        <p>Please fill out the form below to enroll in the selected course.</p>
        
        <form id="enrollment-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Please choose an option--</option>
                <option value="course1">Course 1</option>
                <option value="course2">Course 2</option>
                <option value="course3">Course 3</option>
            </select>

            <button type="submit">Enroll Now</button>
        </form>
    </main>

    <footer>
        <!-- Include Footer Component -->
        <div id="footer-placeholder"></div>
    </footer>

    <script src="../scripts/main.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script>
        // Load Header and Footer Components
        document.getElementById('header-placeholder').innerHTML = '<!-- Header HTML goes here -->';
        document.getElementById('footer-placeholder').innerHTML = '<!-- Footer HTML goes here -->';
    </script>
</body>
</html>
